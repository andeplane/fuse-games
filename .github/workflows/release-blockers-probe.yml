name: Release blockers screenshots
on:
  push:
    branches: [codex/playtest-release-probe]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
      - run: npm install --prefix "$RUNNER_TEMP/fuse-browser" agent-browser@0.41.2
      - name: Capture the real lobby flow before and after
        run: |
          set -euo pipefail
          mkdir -p artifacts/layout
          pnpm exec tsx service/dev.ts --port 8787 > artifacts/room-service.log 2>&1 &
          room=$!
          export AGENT_BROWSER_EXECUTABLE_PATH="$(command -v google-chrome)"
          export AGENT_BROWSER_ARGS="--mute-audio"
          ab=("$RUNNER_TEMP/fuse-browser/node_modules/.bin/agent-browser" --session release-evidence)
          trap '"${ab[@]}" close; kill "$room" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          "${ab[@]}" skills get core >/dev/null
          for side in before after; do
            target=https://fusegames.ai
            if [[ "$side" = after ]]; then target=http://127.0.0.1:8787; fi
            for game in cyberfuse incrediblefuse; do
              "${ab[@]}" open "$target/$game/?mute"
              "${ab[@]}" wait .fui-main-menu
              "${ab[@]}" find role button click --name PLAY --exact
              "${ab[@]}" find role button click --name 'HOST ROOM' --exact
              "${ab[@]}" wait .fui-room-head
              for pair in 360:800 844:390 1440:900; do
                width=${pair%:*}
                height=${pair#*:}
                "${ab[@]}" set viewport "$width" "$height"
                "${ab[@]}" screenshot "artifacts/layout/$side-$game-$width.png"
              done
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-browser-layout-comparison
          path: artifacts/layout/*.png
