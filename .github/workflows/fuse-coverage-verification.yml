name: Fuse behavior coverage verification
on:
  push:
    branches: [codex/playtest-coverage-verification]
permissions:
  contents: read
  actions: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Check that previously tested production sources are identical
        run: git diff --exit-code c3dc169b20bbe3467fde04d7c2a4b0c77093919a HEAD -- packages/*/src service 'games/*/src/**' .c8rc.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*-raw-*
          path: coverage/tmp/
          merge-multiple: true
          run-id: 44524707605
          github-token: ${{ github.token }}
      - name: Run the new behavior tests with V8 collection
        run: |
          NODE_V8_COVERAGE="$PWD/coverage/tmp" pnpm exec tsx --test --test-concurrency=2 \
            games/fuse-craft/tests/camera.test.ts games/fuse-front/tests/app.test.ts \
            packages/fuse-telemetry/tests/debug.test.ts \
            packages/fuse-ui/tests/game-audio.test.ts packages/fuse-ui/tests/playtest.test.ts \
            packages/fuse-ui/tests/social.test.ts packages/fuse-ui/tests/top-bar.test.ts
      - name: Recalculate unchanged repository coverage thresholds
        run: COVERAGE_PHASE=report pnpm test:coverage
