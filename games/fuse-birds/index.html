<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#030b1d" />
    <!-- Added to a home screen, a game opens full screen: no browser bars around the play. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link
      rel="icon"
      type="image/png"
      href="/fuseos/game-icons/fuse-birds.png"
    />
    <meta
      name="description"
      content="Fuse Birds: a neon artillery battle for 2–5 friends. Pull your slingshot, scatter bombs, and reshape the battlefield."
    />
    <title>Fuse Birds</title>
  </head>
  <body class="fui-app">
    <div id="app"></div>
    <script type="module" src="./src/app/main.ts"></script>
  </body>
</html>
